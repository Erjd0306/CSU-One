<!-- Maintenance Tasks: urgent notice, current task with its next action, and the full task list. -->
<template data-component="MaintenanceTasksView" data-from="./TasksPage"
          data-props="activeCount urgent showUrgent current currentLocation query setQuery priority setPriority priorityOptions filter setFilter filterOptions counts visible newLabel clearFilters"
          data-imports="RepairActions:./RepairActions">
  <div class="maintenance-tasks">
    <PageHeader title="Assigned tasks" description="{{ activeCount }} active task{{ activeCount === 1 ? '' : 's' }}, most urgent first." />

    <div data-if="urgent > 0" role="status" class="maintenance-tasks__urgent">
      <Icon.TriangleAlert :size="18" class="maintenance-tasks__urgent-icon" aria-hidden />
      <p class="maintenance-tasks__urgent-text">
        <span class="maintenance-tasks__urgent-count">{{ urgent }} urgent task{{ urgent === 1 ? '' : 's' }}</span> {{ urgent === 1 ? 'needs' : 'need' }} attention first.
      </p>
      <button type="button" class="btn-ghost btn-sm maintenance-tasks__urgent-button" @click="showUrgent">Show urgent</button>
    </div>

    <section data-if="current" class="panel" aria-labelledby="current-task">
      <div class="panel-header">
        <h2 id="current-task" class="panel-title">Current task</h2>
        <Link to="/maintenance/tasks/{{ current?.id }}" class="link maintenance-tasks__details">Details<Icon.ArrowRight :size="14" aria-hidden /></Link>
      </div>
      <div data-if="current" class="maintenance-tasks__current">
        <div>
          <div class="maintenance-tasks__badges">
            <span class="maintenance-tasks__id">{{ current.id }}</span>
            <PriorityBadge :priority="current.priority" />
            <StatusBadge :status="current.status" />
          </div>
          <p class="maintenance-tasks__title">{{ current.title }}</p>
          <p class="maintenance-tasks__location">
            <Icon.MapPin :size="15" class="maintenance-tasks__location-icon" aria-hidden />
            <span>{{ currentLocation }}</span>
          </p>
        </div>
        <div class="maintenance-tasks__next">
          <RepairActions :report="current" />
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="task-list">
      <div class="panel-header"><h2 id="task-list" class="panel-title">All assigned tasks</h2></div>
      <div class="maintenance-tasks__filters">
        <div class="maintenance-tasks__controls">
          <SearchInput label="Search tasks" placeholder="Search tasks" :value="query" @change="(e) => setQuery(e.target.value)" />
          <AppSelect ariaLabel="Filter by priority" :value="priority" :options="priorityOptions" :onChange="setPriority" />
        </div>
        <ChipGroup label="Filter by status" :options="filterOptions" :value="filter" :onChange="setFilter" :counts="counts" />
      </div>
      <p class="maintenance-tasks__count" aria-live="polite">{{ visible.length }} task{{ visible.length === 1 ? '' : 's' }}</p>

      <ul data-if="visible.length" class="maintenance-tasks__list">
        <li data-for="r in visible" :key="r.id" class="maintenance-tasks__item">
          <span data-if="newLabel(r)" class="maintenance-tasks__new-marker" aria-hidden></span>
          <ReportCard :report="r" to="/maintenance/tasks/{{ r.id }}" showFlags :meta="newLabel(r)" />
        </li>
      </ul>
      <EmptyState data-else-if="activeCount" title="No tasks match" message="Try a different search or filter.">
        <template data-slot="action"><button type="button" class="btn-secondary" @click="clearFilters">Clear filters</button></template>
      </EmptyState>
      <EmptyState data-else :icon="Icon.ClipboardCheck" title="No active tasks" message="New assignments from the Facilities Office will appear here." />
    </section>
  </div>
</template>
