<!-- Profile page (all roles): identity, four collapsible sections, and log out. -->
<template data-component="ProfileView" data-from="./ProfilePage"
          data-props="user roleLabel personalRows accountRows isOpen toggle prefs togglePref statusLabel assignPref resetOpen openReset closeReset confirmReset"
          data-imports="ChangePassword:./ProfilePage">
  <div class="profile-page">
    <PageHeader title="Profile" />

    <div class="profile-page__identity">
      <Avatar :initials="user.initials" size="lg" />
      <div class="profile-page__identity-text">
        <p class="profile-page__name">{{ user.name }}</p>
        <p class="profile-page__role">{{ roleLabel }}</p>
      </div>
    </div>

    <ProfileAccordion>
      <ProfileAccordionSection id="personal" title="Personal Information" summary="{{ user.name }} · {{ user.email }}"
                               :icon="Icon.UserRound" :open="isOpen('personal')" :onToggle="toggle">
        <dl class="profile-page__rows">
          <div data-for="row in personalRows" :key="row.label" class="profile-page__row">
            <dt>{{ row.label }}</dt>
            <dd>{{ row.value }}</dd>
          </div>
        </dl>
        <p class="profile-page__note">To correct your details, contact the Registrar or the Human Resource Office.</p>
      </ProfileAccordionSection>

      <ProfileAccordionSection id="account" title="Account Information" summary="{{ roleLabel }} · {{ user.idNumber }}"
                               :icon="Icon.IdCard" :open="isOpen('account')" :onToggle="toggle">
        <div class="profile-page__account">
          <dl class="profile-page__rows">
            <div data-for="row in accountRows" :key="row.label" class="profile-page__row">
              <dt>{{ row.label }}</dt>
              <dd>{{ row.value }}</dd>
            </div>
          </dl>
          <div class="profile-page__reset">
            <p class="profile-page__reset-text">Your reports and settings are saved in this browser only. Reset to clear them.</p>
            <button type="button" class="btn-secondary profile-page__reset-button" @click="openReset"><Icon.RotateCcw :size="16" aria-hidden />Reset data</button>
          </div>
        </div>
      </ProfileAccordionSection>

      <ProfileAccordionSection id="notifications" title="Notifications" summary="{{ prefs.statusUpdates ? 'Status updates on' : 'Status updates off' }}"
                               :icon="Icon.Bell" :open="isOpen('notifications')" :onToggle="toggle">
        <div class="profile-page__toggles">
          <Toggle id="pref-status" :label="statusLabel.title" :description="statusLabel.desc" :checked="prefs.statusUpdates" :onChange="(v) => togglePref('statusUpdates', v)" />
          <Toggle data-if="assignPref" id="pref-assign" :label="assignPref.title" :description="assignPref.desc" :checked="prefs.assignments" :onChange="(v) => togglePref('assignments', v)" />
          <Toggle id="pref-email" label="Email copies" description="Not sent yet in this prototype." :checked="prefs.email" :onChange="(v) => togglePref('email', v)" />
          <Toggle id="pref-sms" label="SMS alerts for urgent items" description="Not sent yet in this prototype." :checked="prefs.sms" :onChange="(v) => togglePref('sms', v)" />
        </div>
      </ProfileAccordionSection>

      <ProfileAccordionSection id="security" title="Security" summary="Change your password"
                               :icon="Icon.ShieldCheck" :open="isOpen('security')" :onToggle="toggle">
        <ChangePassword />
      </ProfileAccordionSection>
    </ProfileAccordion>

    <div class="profile-page__logout">
      <div>
        <h2 class="profile-page__logout-title">Log out</h2>
        <p class="profile-page__logout-text">End your session on this device.</p>
      </div>
      <LogoutButton className="btn-danger profile-page__logout-button" />
    </div>

    <ConfirmDialog data-if="resetOpen" title="Reset all data?"
                   message="This deletes every report, notification, and new account saved in this browser. You will be logged out."
                   confirmLabel="Reset data" tone="danger" :onCancel="closeReset" :onConfirm="confirmReset" />
  </div>
</template>
