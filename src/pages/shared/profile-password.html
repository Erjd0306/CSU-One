<!-- Change-password form inside the Profile page's Security section. -->
<template data-component="ChangePasswordView" data-from="./ProfilePage"
          data-props="current next confirm errors saving setField submit">
  <form @submit="submit" novalidate class="profile-password">
    <PasswordField id="pw-current" label="Current password" :value="current" :onChange="(e) => setField('current', e.target.value)"
                   :error="errors.current" autoComplete="current-password" :disabled="saving" />
    <div class="profile-password__pair">
      <PasswordField id="pw-next" label="New password" :value="next" :onChange="(e) => setField('next', e.target.value)"
                     :error="errors.next" hint="At least 8 characters, letters and numbers." autoComplete="new-password" :disabled="saving" />
      <PasswordField id="pw-confirm" label="Confirm new password" :value="confirm" :onChange="(e) => setField('confirm', e.target.value)"
                     :error="errors.confirm" autoComplete="new-password" :disabled="saving" />
    </div>
    <div class="profile-password__actions">
      <PrimaryButton type="submit" :icon="Icon.KeyRound" :loading="saving" loadingText="Updating…" :disabled="!current || !next || !confirm">Update password</PrimaryButton>
    </div>
  </form>
</template>
